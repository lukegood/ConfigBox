master:
  push:
    - name: ConfigBox CI
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      docker:
        image: ubuntu:24.04

      stages:
        - name: Python tests
          image: python:3.12-slim
          script:
            - pip install --no-cache-dir -r requirements.txt
            - python -m pytest -q

        - name: Frontend build
          image: node:22-bookworm-slim
          script:
            - cd frontend
            - npm ci --no-audit --no-fund
            - npm run build


"v*":
  tag_push:
    - name: CNB Registry CA Diagnosis
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      services:
        - docker

      docker:
        image: ubuntu:24.04

      stages:
        - name: Check CA environment
          script: |
            set -eu

            echo "=== OS ==="
            cat /etc/os-release

            echo
            echo "=== ca-certificates package ==="
            dpkg -s ca-certificates || true

            echo
            echo "=== CA bundle ==="
            ls -l /etc/ssl/certs/ca-certificates.crt || true

        - name: Install CA certificates
          script: |
            set -eu

            apt-get update
            DEBIAN_FRONTEND=noninteractive \
              apt-get install -y --no-install-recommends ca-certificates

            update-ca-certificates

            echo
            echo "=== CA bundle after installation ==="
            ls -lh /etc/ssl/certs/ca-certificates.crt

        - name: Test Buildx push
          script: |
            set -eu

            CNB_IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            echo "=== Docker ==="
            docker version

            echo
            echo "=== Buildx ==="
            docker buildx version
            docker buildx ls
            docker buildx inspect --bootstrap

            echo
            echo "=== Login ==="
            printf '%s' "${CNB_TOKEN}" | \
              docker login "${CNB_DOCKER_REGISTRY}" \
                --username "${CNB_TOKEN_USER_NAME}" \
                --password-stdin

            echo
            echo "=== Buildx push test ==="

            mkdir -p /tmp/cnb-buildx-test

            printf 'FROM scratch\nLABEL test="cnb-buildx-ca-fixed"\n' \
              > /tmp/cnb-buildx-test/Dockerfile

            docker buildx build \
              --progress=plain \
              --platform linux/amd64 \
              -t "${CNB_IMAGE}:tls-buildx-ca-test" \
              --push \
              /tmp/cnb-buildx-test

            echo
            echo "Buildx push: SUCCESS"
