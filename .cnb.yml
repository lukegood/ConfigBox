master:
  push:
    - name: ConfigBox CI
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      docker:
        image: ubuntu:24.04

      stages:
        - name: Python tests
          image: python:3.12-slim
          script:
            - pip install --no-cache-dir -r requirements.txt
            - python -m pytest -q

        - name: Frontend build
          image: node:22-bookworm-slim
          script:
            - cd frontend
            - npm ci --no-audit --no-fund
            - npm run build


"v*":
  tag_push:
    - name: CNB Registry TLS Diagnosis
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      services:
        - docker

      docker:
        image: ubuntu:24.04

      stages:
        - name: Diagnose CNB registry TLS
          script: |
            set -eu

            CNB_IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"

            echo "========================================"
            echo "CNB Registry TLS diagnosis"
            echo "Registry: ${CNB_DOCKER_REGISTRY}"
            echo "Image:    ${CNB_IMAGE}"
            echo "========================================"

            echo
            echo "=== Docker version ==="
            docker version

            echo
            echo "=== Docker info ==="
            docker info

            echo
            echo "=== Docker Buildx version ==="
            docker buildx version

            echo
            echo "=== Docker Buildx builders ==="
            docker buildx ls

            echo
            echo "=== Current Buildx builder ==="
            docker buildx inspect --bootstrap

            echo
            echo "=== Login to CNB registry ==="
            printf '%s' "${CNB_TOKEN}" | \
              docker login "${CNB_DOCKER_REGISTRY}" \
                --username "${CNB_TOKEN_USER_NAME}" \
                --password-stdin

            echo
            echo "========================================"
            echo "TEST 1: Docker CLI push"
            echo "========================================"

            mkdir -p /tmp/cnb-docker-test

            printf 'FROM scratch\nLABEL test="cnb-docker-cli-tls"\n' \
              > /tmp/cnb-docker-test/Dockerfile

            docker build \
              -t "${CNB_IMAGE}:tls-docker-test" \
              /tmp/cnb-docker-test

            docker push "${CNB_IMAGE}:tls-docker-test"

            echo
            echo "Docker CLI push: SUCCESS"

            echo
            echo "========================================"
            echo "TEST 2: Buildx / BuildKit push"
            echo "========================================"

            mkdir -p /tmp/cnb-buildx-test

            printf 'FROM scratch\nLABEL test="cnb-buildx-tls"\n' \
              > /tmp/cnb-buildx-test/Dockerfile

            docker buildx build \
              --progress=plain \
              --platform linux/amd64 \
              -t "${CNB_IMAGE}:tls-buildx-test" \
              --push \
              /tmp/cnb-buildx-test

            echo
            echo "Buildx push: SUCCESS"

            echo
            echo "========================================"
            echo "All CNB registry TLS tests passed"
            echo "========================================"
