master:
  push:
    - name: ConfigBox CI
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      docker:
        image: ubuntu:24.04

      stages:
        - name: Python tests
          image: python:3.12-slim
          script:
            - pip install --no-cache-dir -r requirements.txt
            - python -m pytest -q

        - name: Frontend build
          image: node:22-bookworm-slim
          script:
            - cd frontend
            - npm ci --no-audit --no-fund
            - npm run build


"v*":
  tag_push:
    - name: ConfigBox Docker Hub Auth Test
      runner:
        tags: cnb:arch:amd64
        cpus: 8

      services:
        - docker

      docker:
        image: ubuntu:24.04

      imports:
        - https://cnb.cool/linuxmore/ConfigBox-Secrets/-/blob/main/dockerhub.yml

      stages:
        - name: Docker Hub login
          script: |
            printf '%s' "$DOCKERHUB_TOKEN" | \
              docker login \
                --username "$DOCKERHUB_USERNAME" \
                --password-stdin
